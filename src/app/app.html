@if (estConnecte()) {
  <p-menubar [model]="elementsMenu()">
    <ng-template #end>
      <div class="flex items-center gap-3">
        <p-button
          [icon]="sombre() ? 'pi pi-sun' : 'pi pi-moon'"
          [text]="true"
          (onClick)="basculerTheme()"
          [ariaLabel]="'Basculer le theme'"
        />
        @if (utilisateur(); as u) {
          <span class="text-sm">{{ u.nomComplet }} ({{ u.roles.join(', ') }})</span>
        }
        <p-button label="Deconnexion" icon="pi pi-sign-out" severity="secondary" (onClick)="deconnecter()" />
      </div>
    </ng-template>
  </p-menubar>
} @else {
  <p-button
    [icon]="sombre() ? 'pi pi-sun' : 'pi pi-moon'"
    [text]="true"
    (onClick)="basculerTheme()"
    styleClass="fixed top-4 right-4"
    [ariaLabel]="'Basculer le theme'"
  />
}

<p-toast />
<p-confirmdialog />

<main class="p-4">
  <router-outlet />
</main>
