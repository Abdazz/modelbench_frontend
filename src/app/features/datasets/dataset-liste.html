<p-table
  [value]="donnees()"
  [lazy]="true"
  (onLazyLoad)="charger($event)"
  [totalRecords]="total()"
  [loading]="chargement()"
  [paginator]="true"
  [(first)]="premier"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 25, 50]"
  dataKey="id"
  [tableStyle]="{ 'min-width': '60rem' }"
>
  <ng-template #caption>
    <div class="flex flex-wrap items-center justify-between gap-3">
      <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          type="text"
          placeholder="Rechercher..."
          [attr.aria-label]="'Recherche globale'"
          (input)="surRecherche($any($event.target).value)"
        />
      </p-iconfield>

      <p-select
        [options]="formats()"
        optionLabel="libelle"
        optionValue="valeur"
        placeholder="Tous les formats"
        [showClear]="true"
        (onChange)="surChangementFormat($event.value)"
      />

      @if (estAdmin()) {
        <p-button label="Nouveau dataset" icon="pi pi-plus" (onClick)="ouvrirCreation()" />
      }
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="nom">Nom <p-sortIcon field="nom" /></th>
      <th>Description</th>
      <th>Source</th>
      <th pSortableColumn="nombreObservations">Observations <p-sortIcon field="nombreObservations" /></th>
      <th>Format</th>
      <th pSortableColumn="dateAjout">Date d ajout <p-sortIcon field="dateAjout" /></th>
      @if (estAdmin()) {
        <th>Actions</th>
      }
    </tr>
  </ng-template>

  <ng-template #body let-dataset>
    <tr>
      <td>{{ dataset.nom }}</td>
      <td>{{ dataset.description || '-' }}</td>
      <td>{{ dataset.source }}</td>
      <td>{{ dataset.nombreObservations }}</td>
      <td><p-tag [value]="dataset.format" /></td>
      <td>{{ dataset.dateAjout }}</td>
      @if (estAdmin()) {
        <td class="flex gap-2">
          <p-button
            icon="pi pi-pencil"
            [text]="true"
            [ariaLabel]="'Modifier'"
            (onClick)="ouvrirEdition(dataset)"
          />
          <p-button
            icon="pi pi-trash"
            [text]="true"
            severity="danger"
            [ariaLabel]="'Supprimer'"
            (onClick)="confirmerSuppression(dataset)"
          />
        </td>
      }
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td [attr.colspan]="estAdmin() ? 7 : 6">Aucun dataset trouve.</td>
    </tr>
  </ng-template>

  <ng-template #loadingbody>
    <tr>
      <td [attr.colspan]="estAdmin() ? 7 : 6"><p-skeleton height="2rem" /></td>
    </tr>
  </ng-template>
</p-table>

<app-dataset-formulaire
  [visible]="dialogueVisible()"
  [mode]="modeDialogue()"
  [donneesInitiales]="datasetEnEdition()"
  [formats]="formats()"
  (visibleChange)="dialogueVisible.set($event)"
  (sauvegarde)="surSauvegarde()"
/>
