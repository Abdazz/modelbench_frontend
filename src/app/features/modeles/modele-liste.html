<p-table
  [value]="donnees()"
  [lazy]="true"
  (onLazyLoad)="charger($event)"
  [totalRecords]="total()"
  [loading]="chargement()"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 25, 50]"
  dataKey="id"
  [tableStyle]="{ 'min-width': '60rem' }"
>
  <ng-template #caption>
    <div class="flex flex-wrap items-center justify-between gap-3">
      <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          type="text"
          placeholder="Rechercher..."
          [attr.aria-label]="'Recherche globale'"
          (input)="surRecherche($any($event.target).value)"
        />
      </p-iconfield>

      <p-select
        [options]="types()"
        optionLabel="libelle"
        optionValue="valeur"
        placeholder="Tous les types"
        [showClear]="true"
        (onChange)="surChangementType($event.value)"
      />

      @if (estAdmin()) {
        <p-button label="Nouveau modele" icon="pi pi-plus" (onClick)="ouvrirCreation()" />
      }
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="nom">Nom <p-sortIcon field="nom" /></th>
      <th>Type</th>
      <th>Algorithme</th>
      <th>Version</th>
      <th pSortableColumn="dateCreation">Date de creation <p-sortIcon field="dateCreation" /></th>
      @if (estAdmin()) {
        <th>Actions</th>
      }
    </tr>
  </ng-template>

  <ng-template #body let-modele>
    <tr>
      <td>{{ modele.nom }}</td>
      <td><p-tag [value]="modele.type" /></td>
      <td>{{ modele.algorithme }}</td>
      <td>{{ modele.version }}</td>
      <td>{{ modele.dateCreation }}</td>
      @if (estAdmin()) {
        <td class="flex gap-2">
          <p-button
            icon="pi pi-pencil"
            [text]="true"
            [attr.aria-label]="'Modifier'"
            (onClick)="ouvrirEdition(modele)"
          />
          <p-button
            icon="pi pi-trash"
            [text]="true"
            severity="danger"
            [attr.aria-label]="'Supprimer'"
            (onClick)="confirmerSuppression(modele)"
          />
        </td>
      }
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td [attr.colspan]="estAdmin() ? 6 : 5">Aucun modele trouve.</td>
    </tr>
  </ng-template>

  <ng-template #loadingbody>
    <tr>
      <td [attr.colspan]="estAdmin() ? 6 : 5"><p-skeleton height="2rem" /></td>
    </tr>
  </ng-template>
</p-table>

<app-modele-formulaire
  [visible]="dialogueVisible()"
  [mode]="modeDialogue()"
  [donneesInitiales]="modeleEnEdition()"
  [types]="types()"
  (visibleChange)="dialogueVisible.set($event)"
  (sauvegarde)="surSauvegarde()"
/>
