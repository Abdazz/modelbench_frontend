<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-[var(--mb-page-bg)] px-4 mb-grid-bg">
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_0%,var(--mb-page-bg)_72%)]"></div>

  <div class="relative w-full max-w-md">
    <div class="mb-8 flex flex-col items-center gap-3 text-center">
      <span class="relative flex h-3 w-3">
        <span class="mb-status-dot absolute inline-flex h-full w-full rounded-full bg-[var(--p-primary-color)] opacity-75"></span>
        <span class="relative inline-flex h-3 w-3 rounded-full bg-[var(--p-primary-color)]"></span>
      </span>
      <h1 class="text-2xl font-bold tracking-tight text-[var(--p-text-color)]">ModelBench</h1>
      <p class="mb-eyebrow text-[0.68rem] text-[var(--p-text-muted-color)]">
        Banc d essai pour modeles de machine learning
      </p>
    </div>

    <div class="rounded-xl border border-[var(--p-content-border-color)] bg-[var(--p-content-background)] p-8 shadow-[0_24px_48px_-24px_rgba(5,30,27,0.35)]">
      <form [formGroup]="formulaire" (ngSubmit)="soumettre()" class="flex flex-col gap-5">
        <div class="flex flex-col gap-2">
          <label for="login" class="mb-eyebrow text-[0.68rem] text-[var(--p-text-muted-color)]">Email</label>
          <p-iconfield class="w-full">
            <p-inputicon class="pi pi-user" />
            <input pInputText id="login" type="email" formControlName="login" autocomplete="username" class="w-full" />
          </p-iconfield>
        </div>

        <div class="flex flex-col gap-2">
          <label for="motDePasse" class="mb-eyebrow text-[0.68rem] text-[var(--p-text-muted-color)]">Mot de passe</label>
          <p-iconfield class="w-full">
            <p-inputicon class="pi pi-lock" />
            <input
              pInputText
              id="motDePasse"
              type="password"
              formControlName="motDePasse"
              autocomplete="current-password"
              class="w-full"
            />
          </p-iconfield>
        </div>

        @if (erreur(); as message) {
          <p-message severity="error" [text]="message" />
        }

        <p-button
          type="submit"
          label="Se connecter"
          [loading]="enCours()"
          [disabled]="formulaire.invalid"
          styleClass="w-full justify-center mt-1"
        />
      </form>
    </div>

    <div class="mt-5 rounded-lg border border-dashed border-[var(--p-content-border-color)] px-4 py-3 font-mono text-[0.72rem] leading-relaxed text-[var(--p-text-muted-color)]">
      <div class="mb-eyebrow mb-1.5 text-[0.6rem] text-[var(--p-text-color)]">Comptes de demonstration</div>
      <div class="flex flex-wrap gap-x-5 gap-y-1">
        <span><strong class="text-[var(--p-text-color)]">admin&#64;example.com</strong> / admin123 <span class="opacity-70">(lecture-ecriture)</span></span>
        <span><strong class="text-[var(--p-text-color)]">chercheur&#64;example.com</strong> / chercheur123 <span class="opacity-70">(lecture seule)</span></span>
      </div>
    </div>
  </div>
</div>
